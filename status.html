<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Status | Books</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
    --bg-primary: #0f0f0f;
    --bg-card: #1e1e1e;
    --bg-tertiary: #242424;
    --text-primary: #f5f5f5;
    --text-secondary: #a0a0a0;
    --text-muted: #666666;
    --accent: #c9a962;
    --accent-soft: rgba(201, 169, 98, 0.15);
    --border: #2a2a2a;
    --font-serif: 'Cormorant Garamond', Georgia, serif;
    --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
    background: var(--bg-primary);
    color: var(--text-primary);
    font-family: var(--font-sans);
    font-weight: 300;
    line-height: 1.6;
    padding: 1.5rem 1.25rem 4rem;
    -webkit-font-smoothing: antialiased;
}
.container { max-width: 760px; margin: 0 auto; }

header { margin-bottom: 2rem; }
.back-link {
    display: inline-flex; align-items: center; gap: 0.5rem;
    color: var(--text-secondary); text-decoration: none;
    font-size: 0.875rem; margin-bottom: 1.5rem;
    transition: color 150ms ease;
}
.back-link:hover { color: var(--accent); }
h1 { font-family: var(--font-serif); font-size: 2.5rem; font-weight: 500; letter-spacing: 0.01em; }
.subtitle { color: var(--text-secondary); font-size: 0.95rem; margin-top: 0.25rem; }

.actions { display: flex; flex-wrap: wrap; gap: 0.625rem; margin-top: 1.25rem; }
.action {
    display: inline-flex; align-items: center; gap: 0.4rem;
    padding: 0.5rem 0.9rem; border-radius: 999px;
    border: 1px solid var(--border); background: var(--bg-card);
    color: var(--text-secondary); text-decoration: none;
    font-size: 0.8125rem; font-family: inherit; cursor: pointer;
    transition: all 150ms ease;
}
.action:hover { border-color: var(--accent); color: var(--accent); }
.action.primary { border-color: var(--accent-soft); color: var(--accent); background: var(--accent-soft); }

h2 {
    font-family: var(--font-serif); font-size: 1.5rem; font-weight: 500;
    margin: 2.5rem 0 1rem; padding-bottom: 0.5rem;
    border-bottom: 1px solid var(--border);
}

.pulse {
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: 12px; padding: 1.25rem; margin-top: 1.5rem;
}
.pulse .when { color: var(--accent); font-size: 0.8125rem; letter-spacing: 0.04em; text-transform: uppercase; }
.pulse .what { font-size: 1.0625rem; margin-top: 0.4rem; word-break: break-word; }
.pulse .meta { color: var(--text-muted); font-size: 0.8125rem; margin-top: 0.5rem; }

ol.commits { list-style: none; }
ol.commits li {
    display: flex; gap: 0.875rem; padding: 0.875rem 0;
    border-bottom: 1px solid var(--border);
}
ol.commits li:last-child { border-bottom: none; }
.sha {
    flex-shrink: 0; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 0.75rem; color: var(--accent); text-decoration: none;
    background: var(--accent-soft); padding: 0.15rem 0.45rem;
    border-radius: 5px; height: fit-content; margin-top: 0.15rem;
}
.commit-body { min-width: 0; }
.commit-msg { font-size: 0.9375rem; word-break: break-word; }
.commit-meta { color: var(--text-muted); font-size: 0.78125rem; margin-top: 0.15rem; }

.entry { border-left: 2px solid var(--border); padding: 0 0 1.5rem 1.125rem; position: relative; }
.entry::before {
    content: ''; position: absolute; left: -5px; top: 0.5rem;
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--accent); opacity: 0.5;
}
.entry:first-child::before { opacity: 1; }
.entry .stamp { color: var(--accent); font-size: 0.78125rem; letter-spacing: 0.04em; text-transform: uppercase; }
.entry .msg { margin-top: 0.25rem; word-break: break-word; }
.files { display: flex; flex-wrap: wrap; gap: 0.375rem; margin-top: 0.625rem; }
.file {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 0.72rem; color: var(--text-secondary);
    background: var(--bg-tertiary); border: 1px solid var(--border);
    padding: 0.15rem 0.45rem; border-radius: 5px;
    max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.muted { color: var(--text-muted); font-size: 0.9rem; font-style: italic; }
footer { margin-top: 3rem; color: var(--text-muted); font-size: 0.78125rem; text-align: center; }
</style>
</head>
<body>
<div class="container">
    <header>
        <a class="back-link" href="./">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
            <span>Books</span>
        </a>
        <h1>Status</h1>
        <p class="subtitle">What has been built here, and when.</p>
        <div class="actions">
            <a class="action primary" href="./">Open the site</a>
            <a class="action" href="https://github.com/rashyl6/books" target="_blank" rel="noopener">Repository</a>
            <a class="action" href="https://github.com/rashyl6/books/blob/main/SESSION-LOG.md" target="_blank" rel="noopener">Raw log</a>
            <button class="action" id="refresh" type="button">Refresh</button>
        </div>
    </header>

    <div class="pulse" id="pulse">
        <div class="when">Last push</div>
        <div class="what muted">Loading…</div>
    </div>

    <h2>Recent commits</h2>
    <ol class="commits" id="commits"><li><span class="muted">Loading…</span></li></ol>

    <h2>Session log</h2>
    <div id="log"><p class="muted">Loading…</p></div>

    <footer>Served from GitHub Pages · updates on every push to <code>main</code></footer>
</div>

<script>
const REPO = 'rashyl6/books';

function ago(date) {
    const s = Math.floor((Date.now() - date.getTime()) / 1000);
    if (s < 60) return 'just now';
    const units = [['minute', 60], ['hour', 3600], ['day', 86400], ['week', 604800], ['month', 2629800], ['year', 31557600]];
    let label = 'just now';
    for (const [name, size] of units) {
        if (s < size) break;
        const n = Math.floor(s / size);
        label = n + ' ' + name + (n === 1 ? '' : 's') + ' ago';
    }
    return label;
}

function el(tag, cls, text) {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined) n.textContent = text;
    return n;
}

async function loadCommits() {
    const list = document.getElementById('commits');
    const pulse = document.getElementById('pulse');
    try {
        const res = await fetch('https://api.github.com/repos/' + REPO + '/commits?per_page=20', {
            headers: { Accept: 'application/vnd.github+json' }
        });
        if (!res.ok) throw new Error('GitHub API returned ' + res.status);
        const commits = await res.json();
        if (!commits.length) throw new Error('no commits');

        const top = commits[0];
        const when = new Date(top.commit.author.date);
        pulse.replaceChildren(
            el('div', 'when', 'Last push · ' + ago(when)),
            el('div', 'what', top.commit.message.split('\n')[0]),
            el('div', 'meta', when.toLocaleString() + ' · ' + (top.commit.author.name || 'unknown'))
        );

        list.replaceChildren(...commits.map(c => {
            const li = el('li');
            const sha = el('a', 'sha', c.sha.slice(0, 7));
            sha.href = c.html_url;
            sha.target = '_blank';
            sha.rel = 'noopener';
            const body = el('div', 'commit-body');
            body.append(
                el('div', 'commit-msg', c.commit.message.split('\n')[0]),
                el('div', 'commit-meta', ago(new Date(c.commit.author.date)) + ' · ' + (c.commit.author.name || 'unknown'))
            );
            li.append(sha, body);
            return li;
        }));
    } catch (err) {
        pulse.replaceChildren(
            el('div', 'when', 'Last push'),
            el('div', 'what muted', 'Could not reach the GitHub API — ' + err.message)
        );
        list.replaceChildren(el('li', 'muted', 'Unavailable.'));
    }
}

// The log format is written by tools/save.sh, so it is parsed directly rather
// than run through a general markdown renderer.
function parseLog(text) {
    const marker = text.indexOf('<!-- log -->');
    const body = marker === -1 ? text : text.slice(marker + '<!-- log -->'.length);
    return body.split(/\n(?=### )/)
        .map(chunk => chunk.trim())
        .filter(chunk => chunk.startsWith('### '))
        .map(chunk => {
            const lines = chunk.split('\n');
            const stamp = lines[0].replace(/^###\s*/, '');
            const files = [];
            const msg = [];
            for (const line of lines.slice(1)) {
                const file = line.match(/^-\s*`(.+)`\s*$/);
                if (file) files.push(file[1]);
                else if (line.trim()) msg.push(line.trim());
            }
            return { stamp, message: msg.join(' '), files };
        });
}

// The Pages CDN can serve a minutes-old copy of SESSION-LOG.md, which would
// show a log that lags the commits listed right above it. The GitHub API is
// authoritative and fresh, so it goes first; the served file is the fallback
// for when the API is rate-limited or this page is opened from disk.
async function fetchLog() {
    try {
        const res = await fetch('https://api.github.com/repos/' + REPO + '/contents/SESSION-LOG.md?ref=main', {
            headers: { Accept: 'application/vnd.github.raw' }
        });
        if (res.ok) return await res.text();
    } catch (err) {
        /* fall through to the local copy */
    }
    const res = await fetch('SESSION-LOG.md?t=' + Date.now());
    if (!res.ok) throw new Error('SESSION-LOG.md returned ' + res.status);
    return await res.text();
}

async function loadLog() {
    const target = document.getElementById('log');
    try {
        const entries = parseLog(await fetchLog());
        if (!entries.length) {
            target.replaceChildren(el('p', 'muted', 'No entries yet — the first save will write one.'));
            return;
        }
        target.replaceChildren(...entries.map(entry => {
            const div = el('div', 'entry');
            div.append(el('div', 'stamp', entry.stamp), el('div', 'msg', entry.message));
            if (entry.files.length) {
                const files = el('div', 'files');
                files.append(...entry.files.map(f => el('span', 'file', f)));
                div.append(files);
            }
            return div;
        }));
    } catch (err) {
        target.replaceChildren(el('p', 'muted', 'Could not load the log — ' + err.message));
    }
}

function refresh() { loadCommits(); loadLog(); }
document.getElementById('refresh').addEventListener('click', refresh);
refresh();
</script>
</body>
</html>
